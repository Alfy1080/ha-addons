<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artifactory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgPrimary: 'var(--bg-primary)',
                        bgSecondary: 'var(--bg-secondary)',
                        bgCard: 'var(--bg-card)',
                        bgCardHover: 'var(--bg-card-hover)',
                        textPrimary: 'var(--text-primary)',
                        textSecondary: 'var(--text-secondary)',
                        accent: 'var(--accent)',
                        accentHover: 'var(--accent-hover)',
                        danger: 'var(--danger)',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-bgPrimary text-textPrimary h-screen flex flex-col overflow-hidden font-sans">
    
    <!-- Header -->
    <header class="bg-bgSecondary border-b border-gray-700 p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-4 flex-1">
            <div class="flex items-center gap-2 text-accent font-bold text-xl">
                <span class="material-icons-round">folder_special</span>
                <span>Artifactory</span>
            </div>
            
            <!-- Breadcrumbs -->
            <div id="breadcrumbs" class="flex items-center flex-wrap gap-1 text-sm font-medium overflow-x-auto whitespace-nowrap hide-scrollbar border-l border-gray-600 pl-4 ml-2">
                <!-- Breadcrumbs populated by JS -->
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="relative hidden sm:block">
                <span class="material-icons-round absolute left-2 top-1.5 text-gray-400 text-lg">search</span>
                <input type="text" id="searchInput" placeholder="Search files..." class="bg-bgCard text-sm rounded-md pl-8 pr-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-accent w-48 transition-all">
            </div>
            
            <button id="btnNewFolder" class="action-btn bg-bgCard hover:bg-bgCardHover rounded-md p-1.5 flex items-center justify-center tooltip" data-tip="New Folder">
                <span class="material-icons-round text-lg">create_new_folder</span>
            </button>
            <button id="btnUpload" class="action-btn bg-accent hover:bg-accentHover text-white rounded-md p-1.5 flex items-center justify-center tooltip" data-tip="Upload File">
                <span class="material-icons-round text-lg">upload_file</span>
            </button>
            <input type="file" id="fileInput" class="hidden" multiple>
            
            <button id="btnRefresh" class="action-btn bg-bgCard hover:bg-bgCardHover rounded-md p-1.5 flex items-center justify-center tooltip" data-tip="Refresh">
                <span class="material-icons-round text-lg">refresh</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-y-auto p-4" id="dropZone">
        <!-- Drag overlay -->
        <div id="dragOverlay" class="absolute inset-0 bg-accent/20 backdrop-blur-sm z-50 hidden flex-col items-center justify-center border-2 border-dashed border-accent rounded-lg m-4">
            <span class="material-icons-round text-6xl text-accent mb-4">cloud_upload</span>
            <h2 class="text-2xl font-bold text-accent">Drop files here to upload</h2>
        </div>

        <!-- File Grid -->
        <div id="fileGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
            <!-- Populated by JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center h-full text-textSecondary">
            <span class="material-icons-round text-6xl mb-4 opacity-50">folder_open</span>
            <p class="text-lg">This folder is empty</p>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden absolute inset-0 bg-bgPrimary/80 z-40 flex items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-600 border-t-accent"></div>
        </div>
    </main>

    <!-- Upload Progress -->
    <div id="uploadProgressContainer" class="hidden fixed bottom-4 right-4 bg-bgSecondary border border-gray-700 rounded-lg shadow-xl w-80 p-4 z-50">
        <div class="flex justify-between items-center mb-2">
            <span class="font-medium text-sm">Uploading...</span>
            <span id="uploadPercent" class="text-xs text-textSecondary">0%</span>
        </div>
        <div class="w-full bg-bgCard rounded-full h-2">
            <div id="uploadProgressBar" class="bg-accent h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>

    <!-- Modals -->
    <!-- Preview Modal -->
    <div id="previewModal" class="modal hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-bgSecondary rounded-lg w-full max-w-5xl max-h-[90vh] flex flex-col shadow-2xl border border-gray-700">
            <div class="p-3 border-b border-gray-700 flex justify-between items-center shrink-0">
                <h3 id="previewTitle" class="font-medium truncate pr-4">File Preview</h3>
                <button id="btnClosePreview" class="text-gray-400 hover:text-white">
                    <span class="material-icons-round">close</span>
                </button>
            </div>
            <div id="previewContent" class="flex-1 overflow-auto p-4 flex items-center justify-center bg-black/20">
                <!-- Content injected here -->
            </div>
            <div class="p-3 border-t border-gray-700 flex justify-end gap-2 shrink-0">
                <a id="btnDownloadPreview" href="#" target="_blank" class="px-4 py-2 bg-bgCard hover:bg-bgCardHover rounded-md text-sm font-medium transition-colors">Download</a>
            </div>
        </div>
    </div>

    <!-- Input Modal (Rename/New Folder) -->
    <div id="inputModal" class="modal hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-bgSecondary rounded-lg w-full max-w-md shadow-xl border border-gray-700">
            <div class="p-4 border-b border-gray-700">
                <h3 id="inputModalTitle" class="font-medium text-lg">Title</h3>
            </div>
            <div class="p-4">
                <form id="inputModalForm">
                    <input type="text" id="inputModalValue" class="w-full bg-bgCard border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-accent" required>
                    <p id="inputModalError" class="text-danger text-sm mt-2 hidden"></p>
                </form>
            </div>
            <div class="p-4 border-t border-gray-700 flex justify-end gap-3 bg-bgCard/30">
                <button id="btnCancelInput" class="px-4 py-2 text-textSecondary hover:text-white transition-colors">Cancel</button>
                <button id="btnConfirmInput" class="px-4 py-2 bg-accent hover:bg-accentHover text-white rounded transition-colors shadow-lg shadow-accent/20">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="deleteModal" class="modal hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-bgSecondary rounded-lg w-full max-w-md shadow-xl border border-gray-700">
            <div class="p-4 border-b border-gray-700 flex items-center gap-2 text-danger">
                <span class="material-icons-round">warning</span>
                <h3 class="font-medium text-lg">Confirm Delete</h3>
            </div>
            <div class="p-4 text-textSecondary">
                Are you sure you want to delete <span id="deleteItemName" class="font-bold text-white"></span>?
                <br>This action cannot be undone.
            </div>
            <div class="p-4 border-t border-gray-700 flex justify-end gap-3 bg-bgCard/30">
                <button id="btnCancelDelete" class="px-4 py-2 text-textSecondary hover:text-white transition-colors">Cancel</button>
                <button id="btnConfirmDelete" class="px-4 py-2 bg-danger hover:bg-red-600 text-white rounded transition-colors">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[200] flex flex-col gap-2"></div>

    <!-- Context Menu -->
    <div id="contextMenu" class="hidden absolute bg-bgSecondary border border-gray-700 rounded-md shadow-xl py-1 z-50 min-w-[160px] text-sm">
        <!-- Populated by JS -->
    </div>

    <script src="app.js"></script>
</body>
</html>
